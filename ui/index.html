<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>convertee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="drop" class="drop">
        <strong>파일을 여기에 끌어다 놓으세요</strong>
        <span>여러 개를 한 번에 놓아도 됩니다. 파일은 이 컴퓨터 밖으로 나가지 않습니다.</span>
      </div>

      <section id="ask" hidden>
        <h2>무엇으로 바꿀까요?</h2>
        <div class="row">
          <div id="actions"></div>
          <div id="jpeg-options" class="options" hidden>
            <label>
              JPEG 파일 이름 끝
              <select id="jpeg-ext">
                <option value="jpg">.jpg</option>
                <option value="jpeg">.jpeg</option>
              </select>
            </label>
            <span class="hint">.jpg와 .jpeg는 같은 형식입니다. 이름 끝만 다르니 편한 쪽을 고르세요.</span>
          </div>
        </div>
        <p id="summary"></p>
      </section>

      <ul id="list"></ul>

      <button id="clear" class="plain" hidden>목록 비우기</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
