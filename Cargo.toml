[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# 빌드 설정은 처음에 정하고 바꾸지 않는다. 바꾸면 같은 부품을 다시 컴파일한다. 바꿔야 하면 먼저 묻는다.

# 개발용: 내 코드는 줄 번호만 남겨 빌드 폴더를 줄인다
[profile.dev]
debug = "line-tables-only"

# 개발용: 가져온 라이브러리는 디버그 정보 없이 최적화한다 (화질 측정이 계산이 많아 시험이 느려지지 않게)
[profile.dev.package."*"]
opt-level = 2
debug = false

# 릴리스: 기능이 다 된 뒤 한 번만 빌드한다
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
